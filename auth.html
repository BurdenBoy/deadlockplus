<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Deadlock Plus — аккаунт</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Exo+2:wght@700;800&family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<nav class="nav solid"><div class="wrap"><a class="brand" href="./"><img src="assets/icon.svg" alt="" width="38" height="38">Deadlock <span>Plus</span></a></div></nav>
<main class="page">
  <div class="rays" aria-hidden="true"></div>
  <canvas id="flow" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;z-index:-2"></canvas>
  <div class="glass" id="box"></div>
</main>
<script>
// Page the e-mail links (confirm address, reset password) lead to. Supabase puts the session in the
// address fragment; it is read once, removed from the address bar and kept only in memory.
const SUPABASE_URL = "https://sazdxtxhqqzrapinymha.supabase.co";
const SUPABASE_KEY = "sb_publishable_n8Js6ldrDGcePWd8L4CfhA_6kFVVYni"; // public key, made to be shipped
const frag = location.hash.replace(/^#/, "");
const q = new URLSearchParams(frag || location.search.replace(/^\?/, ""));
if (frag) history.replaceState(null, "", location.pathname);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const appLink = frag ? "deadlockplus://auth#" + frag : "deadlockplus://auth";
const OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const KEY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>';
const BAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>';
const box = document.getElementById("box");
const openBtn = (label) => `<a class="btn acc big" href="${esc(appLink)}">${label}</a>`;

const type = q.get("type");
const error = q.get("error_description") || q.get("error");
const access = q.get("access_token");

if (error) {
  const expired = /expired|invalid/i.test(error);
  box.innerHTML = `<div class="ic">${BAD}</div><h1>Ссылка не сработала</h1>
    <p>${expired ? "Ссылка из письма устарела или уже использована." : esc(error)} Открой Deadlock Plus и запроси новое письмо — на экране входа или через «Забыли пароль?».</p>
    <div class="cta">${openBtn("Открыть Deadlock Plus")}<a class="btn big" href="./">На сайт</a></div>`;
} else if (access && type === "recovery") {
  box.innerHTML = `<div class="ic">${KEY}</div><h1>Новый пароль</h1>
    <p>Задай новый пароль для аккаунта Deadlock Plus.</p>
    <div class="form"><label>Новый пароль<input id="p1" type="password" autocomplete="new-password" placeholder="минимум 8 символов, буквы и цифры"></label>
      <label>Ещё раз<input id="p2" type="password" autocomplete="new-password"></label>
      <button class="btn acc big" id="save">Сохранить пароль</button><div class="err" id="err"></div></div>
    ${mobile ? "" : `<div class="or">или</div><div class="cta" style="margin-top:8px">${openBtn("Задать в Deadlock Plus")}</div>`}`;
  const save = async () => {
    const a = document.getElementById("p1").value, b = document.getElementById("p2").value, err = document.getElementById("err");
    err.textContent = "";
    if (a !== b) return (err.textContent = "Пароли не совпадают.");
    if (a.length < 8 || !/\p{L}/u.test(a) || !/\d/.test(a)) return (err.textContent = "Пароль: минимум 8 символов, буквы и цифры.");
    const btn = document.getElementById("save");
    btn.disabled = true;
    try {
      const r = await fetch(SUPABASE_URL + "/auth/v1/user", { method: "PUT", headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + access, "Content-Type": "application/json" }, body: JSON.stringify({ password: a }) });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(/same_password/.test(j.error_code) ? "Новый пароль совпадает со старым." : /weak/.test(j.error_code) ? "Пароль слишком простой." : r.status === 401 ? "Ссылка устарела — запроси новое письмо." : "Не получилось, попробуй ещё раз.");
      }
      box.innerHTML = `<div class="ic ok">${OK}</div><h1>Пароль изменён</h1><p>Теперь входи в Deadlock Plus с новым паролем.</p>
        <div class="cta">${mobile ? `<a class="btn big" href="./">На сайт</a>` : `<a class="btn acc big" href="deadlockplus://auth">Открыть Deadlock Plus</a>`}</div>`;
    } catch (e) {
      err.textContent = e.message;
      btn.disabled = false;
    }
  };
  document.getElementById("save").onclick = save;
  box.querySelectorAll("input").forEach((i) => (i.onkeydown = (e) => { if (e.key === "Enter") save(); }));
} else if (access) {
  box.innerHTML = `<div class="ic ok">${OK}</div><h1>Почта подтверждена</h1>
    ${mobile
      ? `<p>Готово! Открой Deadlock Plus на компьютере и войди со своей почтой и паролем.</p><div class="cta"><a class="btn big" href="./">На сайт</a></div>`
      : `<p>Готово! Нажми кнопку — Deadlock Plus откроется и сам войдёт в аккаунт. Браузер спросит «Открыть Deadlock Plus?» — разреши.</p>
         <div class="cta">${openBtn("Открыть Deadlock Plus")}</div>
         <small>Не открывается? Запусти Deadlock Plus сам и войди с почтой и паролем.</small>`}`;
} else {
  box.innerHTML = `<div class="ic">${KEY}</div><h1>Аккаунт Deadlock Plus</h1>
    <p>Эта страница открывается по ссылке из письма — для подтверждения почты или нового пароля.</p>
    <div class="cta"><a class="btn acc big" href="./">На главную</a></div>`;
}
</script>
<script src="fx.js"></script>
</body>
</html>
