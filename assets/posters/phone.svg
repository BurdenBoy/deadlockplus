    <g filter="url(#drop)"><g class="" transform="translate(320.0 120.0) scale(12.500)" fill="none" stroke="#f4e7d0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></g></g></g>
