    <g filter="url(#drop)"><g class="" transform="translate(320.0 120.0) scale(12.500)" fill="none" stroke="#f4e7d0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3.2"/></g></g></g>
