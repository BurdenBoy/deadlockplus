    <g filter="url(#drop)"><g class="" transform="translate(320.0 120.0) scale(12.500)" fill="none" stroke="#f4e7d0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g></g></g>
  <rect width="900" height="640" fill="url(#ht)" opacity=".42" mask="url(#htmask)"/>
  <rect width="900" height="640" filter="url(#grain)" opacity=".16"/></g>
<rect x=".5" y=".5" width="899" height="639" rx="0" fill="none" stroke="#fff" stroke-opacity="0"/>
</svg>
