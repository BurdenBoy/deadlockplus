<style>@font-face{font-family:DLSerif;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:DLCond;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:DLCondM;src:url(data:font/woff2;base64,) format('woff2')}
  .serif{font-family:DLSerif,Georgia,serif;font-weight:900}
  .cond{font-family:DLCond,'Arial Narrow',sans-serif;font-weight:700}
  .condm{font-family:DLCondM,'Arial Narrow',sans-serif;font-weight:500}
  .sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
  .float{animation:float 6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .title{animation:title .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes title{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
  .tag{animation:tag .7s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes tag{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .ab{animation:ab 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes ab{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.12)}}
  .rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
