          <rect x="830" y="178" width="56" height="7" rx="3.5" fill="#ffffff" fill-opacity=".25"/>
          <rect x="830" y="200" width="40" height="18" rx="9" fill="#9d8cff" fill-opacity=".85"/></g></g><g transform="rotate(3 985 134)"><g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
          <rect x="930" y="54" width="110" height="160" rx="12" fill="#14131c" stroke="#ff5a5f" stroke-opacity=".6"/>
          <rect x="938" y="62" width="94" height="72" rx="8" fill="#ff5a5f" fill-opacity=".28"/>
          <rect x="940" y="146" width="80" height="8" rx="4" fill="#ffffff" fill-opacity=".55"/>
          <rect x="940" y="162" width="56" height="7" rx="3.5" fill="#ffffff" fill-opacity=".25"/>
          <rect x="940" y="184" width="40" height="18" rx="9" fill="#ff5a5f" fill-opacity=".85"/></g></g><g transform="rotate(10 1095 154)"><g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
