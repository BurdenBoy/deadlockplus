<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Моды в один клик">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15121f"/><stop offset="1" stop-color="#0c0b13"/></linearGradient>
  <radialGradient id="glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#9d8cff" stop-opacity=".30"/><stop offset="1" stop-color="#9d8cff" stop-opacity="0"/></radialGradient>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#9d8cff"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#9d8cff"/></linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="r"><rect width="1200" height="300" rx="18"/></clipPath>
</defs>
<style>
  .t{font:900 64px 'Segoe UI Black','Arial Black','Helvetica Neue',sans-serif;fill:#f5f5f7;letter-spacing:-1px}
  .s{font:600 22px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#ececf0}
  .m{font:400 18px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#9b9ba8}
  .tag{font:700 13px Consolas,'SFMono-Regular',Menlo,monospace;letter-spacing:3px;fill:#9d8cff}
  .bar{animation:bar 3.2s ease-in-out infinite;transform-origin:60px 255px}
  @keyframes bar{0%,100%{transform:scaleX(.55);opacity:.8}50%{transform:scaleX(1);opacity:1}}
  .tw{animation:tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
  .rise{animation:rise 0.9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
<g clip-path="url(#r)">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g transform="rotate(-8 875 150)"><g>
