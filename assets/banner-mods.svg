          <rect x="1048" y="82" width="94" height="72" rx="8" fill="#43d17c" fill-opacity=".28"/>
          <rect x="1050" y="166" width="80" height="8" rx="4" fill="#ffffff" fill-opacity=".55"/>
          <rect x="1050" y="182" width="56" height="7" rx="3.5" fill="#ffffff" fill-opacity=".25"/>
          <rect x="1050" y="204" width="40" height="18" rx="9" fill="#43d17c" fill-opacity=".85"/></g></g><circle class="tw" cx="1105" cy="232" r="1.5" fill="#ffffff" style="animation-delay:-0.77s"/><circle class="tw" cx="978" cy="53" r="2.0" fill="#9d8cff" style="animation-delay:-0.92s"/><circle class="tw" cx="1120" cy="90" r="1.3" fill="#9d8cff" style="animation-delay:-0.66s"/><circle class="tw" cx="920" cy="68" r="0.8" fill="#ffffff" style="animation-delay:-1.88s"/><circle class="tw" cx="852" cy="84" r="1.2" fill="#9d8cff" style="animation-delay:-1.25s"/><circle class="tw" cx="921" cy="186" r="1.7" fill="#9d8cff" style="animation-delay:-0.94s"/><circle class="tw" cx="1157" cy="242" r="0.9" fill="#ffffff" style="animation-delay:-2.15s"/><circle class="tw" cx="1146" cy="224" r="1.0" fill="#9d8cff" style="animation-delay:-2.16s"/><circle class="tw" cx="1018" cy="24" r="0.8" fill="#9d8cff" style="animation-delay:-2.47s"/><circle class="tw" cx="1028" cy="85" r="0.9" fill="#ffffff" style="animation-delay:-0.37s"/><circle class="tw" cx="830" cy="222" r="1.3" fill="#9d8cff" style="animation-delay:-0.40s"/><circle class="tw" cx="1145" cy="226" r="1.0" fill="#9d8cff" style="animation-delay:-2.32s"/><circle class="tw" cx="1006" cy="223" r="1.7" fill="#ffffff" style="animation-delay:-2.32s"/><circle class="tw" cx="1090" cy="238" r="1.1" fill="#9d8cff" style="animation-delay:-1.80s"/><circle class="tw" cx="969" cy="213" r="1.4" fill="#9d8cff" style="animation-delay:-2.29s"/><circle class="tw" cx="981" cy="89" r="1.1" fill="#ffffff" style="animation-delay:-0.36s"/><circle class="tw" cx="952" cy="35" r="1.5" fill="#9d8cff" style="animation-delay:-0.38s"/><circle class="tw" cx="951" cy="150" r="1.6" fill="#9d8cff" style="animation-delay:-2.24s"/>
  <g class="rise">
    <text class="t" x="56" y="104">Моды в один клик</text>
    <text class="s" x="60" y="146">Каталог GameBanana прямо в лаунчере.</text>
    <text class="m" x="60" y="184">Скины, HUD и звуки: включай, меняй порядок,</text><text class="m" x="60" y="212">играй с модами или без — одной кнопкой.</text>
    <rect class="bar" x="60" y="253" width="64" height="4" rx="2" fill="url(#bar)"/>
