<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="AI-тренер">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1912"/><stop offset="1" stop-color="#0e0d0b"/></linearGradient>
  <radialGradient id="glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#ffd27a" stop-opacity=".30"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd27a"/></linearGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="r"><rect width="1200" height="300" rx="18"/></clipPath>
</defs>
<style>
  .t{font:900 64px 'Segoe UI Black','Arial Black','Helvetica Neue',sans-serif;fill:#f5f5f7;letter-spacing:-1px}
  .s{font:600 22px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#ececf0}
  .m{font:400 18px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#9b9ba8}
  .tag{font:700 13px Consolas,'SFMono-Regular',Menlo,monospace;letter-spacing:3px;fill:#ffd27a}
  .bar{animation:bar 3.2s ease-in-out infinite;transform-origin:60px 255px}
  @keyframes bar{0%,100%{transform:scaleX(.55);opacity:.8}50%{transform:scaleX(1);opacity:1}}
  .tw{animation:tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
  .rise{animation:rise 0.9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
<g clip-path="url(#r)">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g>
      <rect x="820" y="70" width="300" height="70" rx="18" fill="#22201a" stroke="#ffd27a" stroke-opacity=".35"/>
      <text x="842" y="112" style="font:600 18px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f2efe6">Что собрать против Haze?</text>
      <rect x="850" y="160" width="320" height="76" rx="18" fill="#ffd27a" fill-opacity=".14" stroke="#ffd27a" stroke-opacity=".5"/>
      <g fill="#ffd27a">
        <circle cx="884" cy="198" r="7"><animate attributeName="cy" values="198;188;198" dur="1.1s" repeatCount="indefinite"/></circle>
        <circle cx="908" cy="198" r="7"><animate attributeName="cy" values="198;188;198" dur="1.1s" begin=".18s" repeatCount="indefinite"/></circle>
        <circle cx="932" cy="198" r="7"><animate attributeName="cy" values="198;188;198" dur="1.1s" begin=".36s" repeatCount="indefinite"/></circle>
      </g>
      <text x="958" y="205" style="font:700 16px Consolas,'SFMono-Regular',Menlo,monospace;fill:#ffd27a">Claude думает…</text>
    </g><path class="tw" d="M1150 42L1155.04 54.96L1168 60L1155.04 65.04L1150 78L1144.96 65.04L1132 60L1144.96 54.96Z" fill="#ffd27a" style="animation-delay:-0.3s;animation-duration:3s"/><path class="tw" d="M790 218L793.36 226.64L802 230L793.36 233.36L790 242L786.64 233.36L778 230L786.64 226.64Z" fill="#ffd27a" style="animation-delay:-1.4s;animation-duration:3s"/><path class="tw" d="M1160 241L1162.52 247.48L1169 250L1162.52 252.52L1160 259L1157.48 252.52L1151 250L1157.48 247.48Z" fill="#ffffff" style="animation-delay:-2s;animation-duration:3s"/><circle class="tw" cx="918" cy="79" r="1.8" fill="#ffffff" style="animation-delay:-2.29s"/><circle class="tw" cx="1084" cy="202" r="2.0" fill="#ffd27a" style="animation-delay:-1.77s"/><circle class="tw" cx="1022" cy="138" r="1.2" fill="#ffd27a" style="animation-delay:-1.63s"/><circle class="tw" cx="766" cy="129" r="1.9" fill="#ffffff" style="animation-delay:-1.85s"/><circle class="tw" cx="1016" cy="85" r="1.4" fill="#ffd27a" style="animation-delay:-1.18s"/><circle class="tw" cx="1012" cy="126" r="1.7" fill="#ffd27a" style="animation-delay:-2.42s"/><circle class="tw" cx="806" cy="190" r="1.9" fill="#ffffff" style="animation-delay:-1.01s"/><circle class="tw" cx="950" cy="273" r="0.9" fill="#ffd27a" style="animation-delay:-1.41s"/><circle class="tw" cx="796" cy="223" r="2.1" fill="#ffd27a" style="animation-delay:-1.35s"/><circle class="tw" cx="768" cy="169" r="1.6" fill="#ffffff" style="animation-delay:-1.86s"/><circle class="tw" cx="961" cy="186" r="2.0" fill="#ffd27a" style="animation-delay:-1.36s"/><circle class="tw" cx="913" cy="266" r="1.1" fill="#ffd27a" style="animation-delay:-1.78s"/><circle class="tw" cx="904" cy="218" r="1.0" fill="#ffffff" style="animation-delay:-2.56s"/><circle class="tw" cx="887" cy="35" r="1.2" fill="#ffd27a" style="animation-delay:-1.04s"/><circle class="tw" cx="726" cy="129" r="1.4" fill="#ffd27a" style="animation-delay:-1.82s"/><circle class="tw" cx="885" cy="89" r="1.1" fill="#ffffff" style="animation-delay:-1.93s"/><circle class="tw" cx="1162" cy="157" r="1.1" fill="#ffd27a" style="animation-delay:-2.08s"/><circle class="tw" cx="904" cy="75" r="1.0" fill="#ffd27a" style="animation-delay:-2.02s"/><circle class="tw" cx="1100" cy="185" r="1.5" fill="#ffffff" style="animation-delay:-1.46s"/><circle class="tw" cx="826" cy="271" r="1.3" fill="#ffd27a" style="animation-delay:-1.66s"/>
  <g class="rise">
    <text class="t" x="56" y="104">AI-тренер</text>
    <text class="s" x="60" y="146">Claude отвечает прямо в матче — текстом или голосом.</text>
    <text class="m" x="60" y="184">Разбор пиков, шансы на победу, что собирать</text><text class="m" x="60" y="212">и что делать в ближайшие минуты.</text>
    <rect class="bar" x="60" y="253" width="64" height="4" rx="2" fill="url(#bar)"/>
    <text class="tag" x="144" y="260">CLAUDE API · VOICE · DRAFT ANALYSIS</text>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="299" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
